name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  client:
    name: Test and build client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm --prefix client ci

      - name: Lint code
        run: npm run client:lint

      - name: Check formatting of the other files
        run: npm run root:lint

      - name: Run tests
        run: npm run client:test

      - name: Build client
        run: npm run client:build

      - name: Check that the server is part of the build
        run: test -f client/dist/api/.htaccess -a -f client/dist/api/index.php -a -d client/dist/api/src

      - name: Upload site
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ./client/dist/
          include-hidden-files: true

  server:
    name: Test server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ hashFiles('server/composer.lock') }}

      - name: Install dependencies
        env:
          COMPOSER_CACHE_VOLUME: ${{ runner.temp }}/composer-cache
        run: docker compose run --rm composer install --no-interaction --no-progress

      - name: Lint code
        run: docker compose run --rm php-lint

      - name: Run tests
        run: docker compose run --rm php-test

  deploy:
    name: Deploy to server
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [client, server]
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: Friedinger/configs/.github/workflows/action-deploy-sftp.yml@main
    with:
      environment: prod
      path: site
      exclude-paths: |
        api/data
        api/config.local.php
        .htaccess
        .htpasswd
    secrets: inherit
