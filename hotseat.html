<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handsum hot-seat</title>
    <style>
      body {
        font-family: monospace;
        margin: 1rem;
      }
      .seats,
      .layout,
      .piles,
      .move-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .seat {
        border: 1px solid;
        padding: 0.5rem;
      }
      .move-group {
        margin-bottom: 0.5rem;
      }
      .card {
        width: 4rem;
        height: 5.5rem;
        border: 2px solid;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
      }
      .card-value {
        font-size: 1.5rem;
      }
      .card-hidden {
        background: repeating-linear-gradient(
          45deg,
          #ccc,
          #ccc 4px,
          #eee 4px,
          #eee 8px
        );
      }
      .card-empty {
        border-style: dashed;
      }
      .message {
        color: red;
      }
      dl {
        display: grid;
        grid-template-columns: max-content auto;
        gap: 0 1rem;
      }
      dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/hotseat/main.ts"></script>
  </body>
</html>
