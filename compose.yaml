x-php: &php
  image: php:8.6.0-cli-alpine@sha256:bb88bd36c3c9e2a74711807115e5491a320b55486ef5ea728c957b1b7411aabd
  volumes:
    - ./server:/server:Z

services:
  php-dev:
    <<: *php
    profiles: [dev]
    init: true
    working_dir: /server
    ports:
      - "127.0.0.1:8080:8080"
    command: php -S 0.0.0.0:8080 index.php

  php-test:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: vendor/bin/phpunit

  php-lint:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: sh -c 'vendor/bin/php-cs-fixer fix --dry-run --diff && vendor/bin/phpstan analyse --memory-limit=512M'

  php-fix:
    <<: *php
    profiles: [tools]
    working_dir: /server
    command: vendor/bin/php-cs-fixer fix

  composer:
    profiles: [tools]
    image: composer:2.11.2@sha256:50ea4d33fdcde1adb0f045547295faa1548b33872e5f789dae5b02ce2fb5de93
    working_dir: /server
    environment:
      COMPOSER_CACHE_DIR: /cache
    volumes:
      - ./server:/server:Z
      - ${COMPOSER_CACHE_VOLUME:-composer-cache}:/cache

volumes:
  composer-cache:
