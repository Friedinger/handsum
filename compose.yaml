x-php: &php
  image: php:8.5.12-cli-alpine@sha256:d9aba00863186c767976ff9b51c217d7737b3e0df982a3a24e41fa05befc9ae2
  volumes:
    - ./server:/server:Z

services:
  php-dev:
    <<: *php
    profiles: [dev]
    init: true
    working_dir: /server
    ports:
      - "127.0.0.1:8080:8080"
    command: php -S 0.0.0.0:8080 index.php

  php-test:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: vendor/bin/phpunit

  php-lint:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: sh -c 'vendor/bin/php-cs-fixer fix --dry-run --diff && vendor/bin/phpstan analyse --memory-limit=512M'

  php-fix:
    <<: *php
    profiles: [tools]
    working_dir: /server
    command: vendor/bin/php-cs-fixer fix

  composer:
    profiles: [tools]
    image: composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
    working_dir: /server
    environment:
      COMPOSER_CACHE_DIR: /cache
    volumes:
      - ./server:/server:Z
      - ${COMPOSER_CACHE_VOLUME:-composer-cache}:/cache

volumes:
  composer-cache:
