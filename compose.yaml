x-php: &php
  image: php:8.5.12-cli-alpine@sha256:84378a65d97b18c8f4fd716b8837e1ca0a3c5ec1ea4d3731e2129049e8487c16
  volumes:
    - ./server:/server:Z

services:
  php-dev:
    <<: *php
    profiles: [dev]
    init: true
    working_dir: /server
    ports:
      - "127.0.0.1:8080:8080"
    command: php -S 0.0.0.0:8080 index.php

  php-test:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: vendor/bin/phpunit

  php-lint:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: sh -c 'vendor/bin/php-cs-fixer fix --dry-run --diff && vendor/bin/phpstan analyse --memory-limit=512M'

  php-fix:
    <<: *php
    profiles: [tools]
    working_dir: /server
    command: vendor/bin/php-cs-fixer fix

  composer:
    profiles: [tools]
    image: composer:2.11.2@sha256:5bcb28b8d0edc4091125f8218f9d088f998bdfc843f8fbb9a4beb4dcd8625684
    working_dir: /server
    environment:
      COMPOSER_CACHE_DIR: /cache
    volumes:
      - ./server:/server:Z
      - ${COMPOSER_CACHE_VOLUME:-composer-cache}:/cache

volumes:
  composer-cache:
