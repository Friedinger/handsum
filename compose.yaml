x-php: &php
  image: php:8.5-cli
  volumes:
    - ./server:/server:Z

services:
  php-dev:
    <<: *php
    profiles: [dev]
    init: true
    working_dir: /server
    ports:
      - "127.0.0.1:8080:8080"
    command: php -d display_errors=On -d error_reporting=E_ALL -S 0.0.0.0:8080 index.php

  php-test:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: vendor/bin/phpunit

  composer:
    profiles: [tools]
    image: composer:2
    working_dir: /server
    environment:
      COMPOSER_CACHE_DIR: /cache
    volumes:
      - ./server:/server:Z
      - composer-cache:/cache

  apache:
    profiles: [deploy-check]
    image: php:8.5-apache
    network_mode: host
    command:
      - sh
      - -c
      - >-
        sed -i 's/AllowOverride None/AllowOverride All/' /etc/apache2/apache2.conf
        && sed -i "s/Listen 80/Listen $${APACHE_PORT}/" /etc/apache2/ports.conf
        && sed -i "s/<VirtualHost \\*:80>/<VirtualHost *:$${APACHE_PORT}>/" /etc/apache2/sites-available/000-default.conf
        && exec apache2-foreground
    environment:
      APACHE_PORT: ${APACHE_PORT:-8089}

volumes:
  composer-cache:
