x-php: &php
  image: php:8.5.13-cli-alpine@sha256:5778fd0bd7bf8c1c823575a3179b4311ef9da6524c6f9f984e71fcacee2b2177
  volumes:
    - ./server:/server:Z

services:
  php-dev:
    <<: *php
    profiles: [dev]
    init: true
    working_dir: /server
    ports:
      - "127.0.0.1:8080:8080"
    command: php -S 0.0.0.0:8080 index.php

  php-test:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: vendor/bin/phpunit

  php-lint:
    <<: *php
    profiles: [test]
    working_dir: /server
    command: sh -c 'vendor/bin/php-cs-fixer fix --dry-run --diff && vendor/bin/phpstan analyse --memory-limit=512M'

  php-fix:
    <<: *php
    profiles: [tools]
    working_dir: /server
    command: vendor/bin/php-cs-fixer fix

  composer:
    profiles: [tools]
    image: composer:2.11.2@sha256:cd3a90dc5624c59a2f9ddf80dad08569f06416db31de519024f249d63bca554b
    working_dir: /server
    environment:
      COMPOSER_CACHE_DIR: /cache
    volumes:
      - ./server:/server:Z
      - ${COMPOSER_CACHE_VOLUME:-composer-cache}:/cache

volumes:
  composer-cache:
